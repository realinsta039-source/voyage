<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres - Instagram</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#000;color:#f5f5f5;min-height:100vh}
    .header{background:#181818;border-bottom:1px solid #262626;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
    .back-btn{background:none;border:none;cursor:pointer;padding:4px;display:flex;color:#f5f5f5}
    .back-btn:hover{opacity:0.7}
    .header span{font-size:15px;font-weight:600}
    .container{max-width:600px;margin:0 auto;padding:20px}
    .page-title{font-size:24px;font-weight:600;margin-bottom:24px}
    .section-title{font-size:13px;color:#a8a8a8;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;padding-left:4px}
    .settings-list{display:flex;flex-direction:column;gap:2px;margin-bottom:24px}
    .settings-item{background:#181818;border:1px solid #262626;border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background 0.2s}
    .settings-item:hover{background:rgba(255,255,255,0.03)}
    .settings-left{display:flex;align-items:center;gap:12px}
    .settings-icon{width:20px;height:20px;color:#a8a8a8}
    .settings-label{font-size:15px}
    .settings-arrow{color:#737373}
    .settings-value{font-size:14px;color:#737373}
    .toggle{position:relative;width:44px;height:24px;background:#363636;border-radius:12px;cursor:pointer;transition:background 0.2s}
    .toggle.active{background:#0095f6}
    .toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform 0.2s}
    .toggle.active::after{transform:translateX(20px)}
    .fake-note{background:rgba(0,149,246,0.08);border:1px solid rgba(0,149,246,0.3);border-radius:12px;padding:16px;font-size:13px;color:#0095f6;text-align:center;line-height:1.5;margin-top:24px}
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="window.location.href='../INSTAGRAM.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <span>⚙️ Paramètres</span>
  </div>

  <div class="container">
    <h1 class="page-title">Paramètres du compte</h1>

    <div class="section-title">Compte</div>
    <div class="settings-list">
      <div class="settings-item">
        <div class="settings-left">
          <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="settings-label">Informations personnelles</span>
        </div>
        <svg class="settings-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-item">
        <div class="settings-left">
          <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span class="settings-label">Mot de passe</span>
        </div>
        <svg class="settings-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="settings-item">
        <div class="settings-left">
          <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="settings-label">Paramètres et confidentialité</span>
        </div>
        <svg class="settings-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>

    <div class="section-title">Préférences</div>
    <div class="settings-list">
      <div class="settings-item">
        <div class="settings-left">
          <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="settings-label">Notifications</span>
        </div>
        <div class="toggle active" onclick="this.classList.toggle('active')"></div>
      </div>
      <div class="settings-item">
        <div class="settings-left">
          <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span class="settings-label">Langue</span>
        </div>
        <span class="settings-value">Français</span>
      </div>
      <div class="settings-item">
        <div class="settings-left">
          <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span class="settings-label">Confidentialité des publications</span>
        </div>
        <svg class="settings-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>

    <div class="fake-note">Ces paramètres sont simulés pour démonstration.</div>
  </div>
</body>
</html>
